{% extends "admin/index.html" %}
{% block content %}
<div style="padding: 20px; background-color: #79aec8; color: white; margin-bottom: 20px; border-radius: 4px;">
    <h2>Automated Allocation Module</h2>
    <p>Click the button below to automatically allocate students to projects based on eligibility, marks, and submission
        time.</p>
    <div style="margin-top: 15px;">
        <a href="{{ run_allocation_url }}" class="button"
            style="background-color: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; margin-right: 10px;">
            ▶️ Run Allocation
        </a>
        <a href="{% url 'admin_merit_list_report' %}" class="button"
            style="background-color: #007bff; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px;">
            📊 View Merit List & Allocation Report
        </a>
    </div>
</div>
{{ block.super }}
{% endblock %}
