{% extends "admin/base_site.html" %}
{% block content %}
<div>
    <h1>Run Project Allocation</h1>
    <p>
        Clicking this button will clear all previous allocations and run the algorithm
        to assign students to projects based on their latest submitted preferences.
    </p>
    <form method="post" action="">
        {% csrf_token %}
        <button type="submit" class="btn btn-success btn-lg">Run Allocation Now</button>
    </form>
</div>
{% endblock %}
