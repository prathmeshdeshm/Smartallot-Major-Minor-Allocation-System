services:
  - type: web
    name: smartallot-web
    env: python
    plan: free
    autoDeploy: true
    buildCommand: ./build.sh
    startCommand: gunicorn smartallot.wsgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: smartallot-db
          property: connectionString

databases:
  - name: smartallot-db
    databaseName: smartallot
    user: smartallot
